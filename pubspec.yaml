name: lifeflow
description: "LifeFlow - Aplicación minimalist de notas y recordatorios asistidos por voz."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Iconos de iOS / Cupertino
  cupertino_icons: ^1.0.6

  # Reconocimiento de voz a texto
  speech_to_text: ^7.3.0

  # Texto a voz (Sintetización de audio)
  flutter_tts: ^3.8.5

  # Almacenamiento local persistente
  shared_preferences: ^2.2.2

  # Lanzador de llamadas telefónicas para SOS / Emergencias
  url_launcher: ^6.2.5
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Configuración opcional de assets / fuentes
  # assets:
  #   - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icono.png"
  remove_alpha_ios: true
